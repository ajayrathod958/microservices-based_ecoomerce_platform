server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
            allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowedHeaders: "*"
            exposedHeaders: X-Correlation-Id
            allowCredentials: true
            maxAge: 3600
      default-filters:
        # Dedupe so CORS headers from downstream never get doubled.
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@ipKeyResolver}"
            redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:20}
            redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:40}
            redis-rate-limiter.requestedTokens: 1
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**,/api/categories/**
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/cart/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /docs/user-service/v3/api-docs
      - name: product-service
        url: /docs/product-service/v3/api-docs
      - name: cart-service
        url: /docs/cart-service/v3/api-docs
      - name: order-service
        url: /docs/order-service/v3/api-docs
      - name: payment-service
        url: /docs/payment-service/v3/api-docs
      - name: inventory-service
        url: /docs/inventory-service/v3/api-docs
      - name: notification-service
        url: /docs/notification-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.microshop: INFO

gateway:
  security:
    # Must match user-service. Override both via env in every real environment.
    jwt-secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
    jwt-issuer: ${JWT_ISSUER:microshop-user-service}
    internal-token: ${INTERNAL_TOKEN:dev-only-internal-token-change-me}
    public-paths:
      - "POST /api/auth/register"
      - "POST /api/auth/login"
      - "POST /api/auth/refresh"
      - "POST /api/auth/logout"
      - "GET /api/products/**"
      - "GET /api/categories/**"
      - "GET /api/inventory/availability"
      - "/docs/**"
      - "/swagger-ui/**"
      - "/swagger-ui.html"
      - "/webjars/**"
      - "/v3/api-docs/**"
      - "/actuator/health/**"
      - "OPTIONS /**"
