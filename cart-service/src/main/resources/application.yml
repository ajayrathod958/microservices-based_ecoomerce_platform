server:
  port: 8083
  forward-headers-strategy: framework

spring:
  application:
    name: cart-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cartdb}
    username: ${DB_USER:microshop}
    password: ${DB_PASSWORD:microshop_pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

security:
  internal-token: ${INTERNAL_TOKEN:dev-only-internal-token-change-me}

app:
  cart:
    cache-ttl: 1h
  product-service:
    # Resolved through Eureka + client-side load balancing. Override only for local debugging.
    url: ${PRODUCT_SERVICE_URL:http://product-service}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
