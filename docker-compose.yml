name: microshop

services:
  # ---------- Infrastructure ----------
  postgres:
    image: postgres:16-alpine
    container_name: microshop-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [microshop-net]

  redis:
    image: redis:7-alpine
    container_name: microshop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [microshop-net]

  # Single-node Kafka in KRaft mode (no Zookeeper needed).
  # Inside Docker use kafka:9092; from your host machine use localhost:29092.
  kafka:
    image: apache/kafka:3.8.0
    container_name: microshop-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [microshop-net]

  # ---------- Optional tooling: docker compose --profile tools up -d ----------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: microshop-kafka-ui
    profiles: [tools]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: microshop
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks: [microshop-net]

  mailhog:
    image: mailhog/mailhog:latest
    container_name: microshop-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks: [microshop-net]

  # ---------- Platform services ----------
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: microshop-discovery
    environment:
      EUREKA_HOSTNAME: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [microshop-net]

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: microshop-gateway
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      REDIS_HOST: redis
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RATE_LIMIT_REPLENISH: ${RATE_LIMIT_REPLENISH}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks: [microshop-net]

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: microshop-user-service
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      DB_HOST: postgres
      DB_NAME: userdb
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks: [microshop-net]

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: microshop-product-service
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      DB_HOST: postgres
      DB_NAME: productdb
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks: [microshop-net]

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: microshop-inventory-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://discovery-server:8761/eureka
      DB_HOST: postgres
      DB_NAME: inventorydb
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    ports:
      - "8086:8086"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks: [microshop-net]

  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    container_name: microshop-cart-service
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      DB_HOST: postgres
      DB_NAME: cartdb
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks: [microshop-net]

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: microshop-order-service
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      DB_HOST: postgres
      DB_NAME: orderdb
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s
    networks: [microshop-net]

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: microshop-payment-service
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      DB_HOST: postgres
      DB_NAME: paymentdb
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s
    networks: [microshop-net]

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: microshop-notification-service
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      DB_HOST: postgres
      DB_NAME: notificationdb
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s
    networks: [microshop-net]

networks:
  microshop-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
