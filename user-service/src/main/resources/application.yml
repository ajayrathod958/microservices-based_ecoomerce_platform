server:
  port: 8081
  # Trust X-Forwarded-* from the gateway so Swagger "Try it out" targets the gateway URL.
  forward-headers-strategy: framework

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:userdb}
    username: ${DB_USER:microshop}
    password: ${DB_PASSWORD:microshop_pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

jwt:
  # >= 32 bytes. Must be identical in user-service and api-gateway. Override in every real environment.
  secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
  issuer: ${JWT_ISSUER:microshop-user-service}
  access-token-ttl: 15m
  refresh-token-ttl: 7d

security:
  # Shared with the gateway; proves identity headers really came from it.
  internal-token: ${INTERNAL_TOKEN:dev-only-internal-token-change-me}

app:
  admin:
    email: ${ADMIN_EMAIL:admin@microshop.local}
    password: ${ADMIN_PASSWORD:Admin@12345}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
